<style>
:root{
  --paper:#faf6f0;--card:#fffdf9;--ink:#2b2320;--ink-soft:#5c5049;--ink-faint:#8a7c72;
  --line:#e4d9cb;--line-2:#d6c7b4;--clay:#a9663a;--cyan:#1596b3;
  --serif:ui-serif,Georgia,"Iowan Old Style",Palatino,"Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --grad:linear-gradient(90deg,#a9663a,#bd8b4c,#8c8177,#6f7d78,#5a8296,#3f93ad,#2aa7c4,#22d3ee);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:17px;line-height:1.65;padding:32px;
  background-image:radial-gradient(1000px 560px at 82% -10%,rgba(34,211,238,.12),transparent 60%),radial-gradient(900px 560px at 4% 4%,rgba(169,102,58,.14),transparent 62%);}
.card{max-width:560px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:44px 40px 40px;box-shadow:0 2px 4px rgba(43,35,32,.06),0 30px 60px -22px rgba(43,35,32,.28);text-align:center;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--grad)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint)}
h1{font-family:var(--serif);font-size:clamp(2.4rem,7vw,3.4rem);margin:14px 0 6px;letter-spacing:-.02em}
p{color:var(--ink-soft);margin:0 auto 26px;max-width:38ch}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;font-weight:650;font-size:15.5px;text-decoration:none;border-radius:999px;padding:13px 24px;border:1px solid transparent;transition:transform .18s,background .18s,color .18s}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:var(--clay);color:#fff;transform:translateY(-2px)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn-ghost:hover{background:#f3ece2;transform:translateY(-2px)}
.rule{height:4px;border-radius:999px;background:var(--grad);margin:30px auto 18px;max-width:220px}
small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <span class="eyebrow">Error 404</span>
  <h1>Not built yet</h1>
  <p>This tile is empty — no road reaches it. The page you were looking for isn't here, but the city is.</p>
  <div class="row">
    <a class="btn btn-primary" href="/idle-city-ages-of-growth/">Back to home</a>
    <a class="btn btn-ghost" href="/idle-city-ages-of-growth/play/">Play the game</a>
  </div>
  <div class="rule"></div>
  <small>IDLE CITY — Ages of Growth · Built by Dr. Sohil Momin</small>
</main>
</body>
</html>
