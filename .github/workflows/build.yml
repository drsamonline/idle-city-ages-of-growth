name: build

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-bundles:
    name: Verify generated bundles are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # was @v7.1.0
        with:
          node-version: 20

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild single-file bundles
        run: node build/build.js

      - name: Fail if committed bundles differ from src/
        run: |
          if ! git diff --quiet -- index.html idle-city.min.html; then
            echo "::error::index.html / idle-city.min.html are out of date."
            echo "Run 'node build/build.js' locally and commit the result."
            git diff --stat -- index.html idle-city.min.html
            exit 1
          fi
          echo "Bundles are up to date. ✅"
